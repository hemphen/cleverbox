name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcjson-dev pkg-config mosquitto python3-venv cmake
      - run: make test test-http test-capacity test-discovery-limit
      - name: Real pinned RadioLib register probes
        run: |
          pin=$(sed -n 's/^    version: //p' firmware/components/radio_transport/idf_component.yml)
          git init build/radiolib-source
          git -C build/radiolib-source fetch --depth=1 https://github.com/jgromes/RadioLib.git "$pin"
          git -C build/radiolib-source checkout --detach FETCH_HEAD
          test "$(git -C build/radiolib-source rev-parse HEAD)" = "$pin"
          make RADIOLIB_SOURCE=build/radiolib-source test-radiolib
      - name: Real local MQTT broker smoke
        run: |
          python3 -m venv build/mqtt-venv
          build/mqtt-venv/bin/pip install paho-mqtt==2.1.0
          PATH="$PWD/build/mqtt-venv/bin:$PATH" make test-mqtt-broker
  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          idf.py set-target esp32c6
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: cleverbox-esp32c6
          path: |
            firmware/dependencies.lock
            firmware/build/cleverbox.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
