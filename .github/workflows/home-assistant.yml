name: Home Assistant integration

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
      timezone: Europe/Stockholm
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  home-assistant:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'run-ha' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y libcjson-dev pkg-config mosquitto
      - run: python -m pip install -r host/requirements-ha.txt
      - run: make test-home-assistant
        env:
          CLEVERBOX_HA_TEST_DIR: ${{ github.workspace }}/build/ha-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-assistant-test-logs
          path: |
            build/ha-integration/check-config.log
            build/ha-integration/broker.log
            build/ha-integration/ha/worker.log
            build/ha-integration/ha/home-assistant.log
