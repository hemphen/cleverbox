# Discovery observation IDs include bridge identity. Replace 020000000001 and radiator IDs.
# Helpers/Apply come from the optional package; adjust customized IDs.
type: vertical-stack
cards:
  - type: entities
    title: Cleverbox transport
    entities:
      - binary_sensor.cleverbox_ready
      - sensor.cleverbox_session
  - type: entities
    title: Radiator 1 — observations and explicit draft
    entities:
      - sensor.cleverbox_020000000001_1_temperature
      - sensor.cleverbox_020000000001_1_observed_target
      - sensor.cleverbox_020000000001_1_observed_mode
      - binary_sensor.cleverbox_020000000001_1_observation_fresh
      - input_number.cleverbox_1_draft_target
      - input_select.cleverbox_1_draft_mode
      - button.cleverbox_1_apply
      - sensor.cleverbox_020000000001_1_last_admission
      - sensor.cleverbox_020000000001_1_last_delivery
  - type: entities
    title: Radiator 2 — observations and explicit draft
    entities:
      - sensor.cleverbox_020000000001_2_temperature
      - sensor.cleverbox_020000000001_2_observed_target
      - sensor.cleverbox_020000000001_2_observed_mode
      - binary_sensor.cleverbox_020000000001_2_observation_fresh
      - input_number.cleverbox_2_draft_target
      - input_select.cleverbox_2_draft_mode
      - button.cleverbox_2_apply
      - sensor.cleverbox_020000000001_2_last_admission
      - sensor.cleverbox_020000000001_2_last_delivery
