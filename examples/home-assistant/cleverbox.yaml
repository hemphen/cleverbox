# Optional draft/Apply controls. MQTT discovery provides the sensors.
# Replace every 020000000001 with your bridge_id and the radiator IDs 1 and 2
# with yours. Editing a draft sends nothing; Apply publishes one command.
mqtt:
  binary_sensor:
    - name: Cleverbox ready
      unique_id: cleverbox_020000000001_ready
      state_topic: cleverbox/v1/020000000001/bridge
      value_template: "{{ 'ON' if value_json.radio_ready and value_json.time_usable else 'OFF' }}"
      expire_after: 15
      availability_topic: cleverbox/v1/020000000001/availability

input_number:
  cleverbox_1_draft_target:
    name: Radiator 1 draft target
    min: 5
    max: 30
    step: 0.5
    initial: 21
    unit_of_measurement: °C
    mode: box
  cleverbox_2_draft_target:
    name: Radiator 2 draft target
    min: 5
    max: 30
    step: 0.5
    initial: 21
    unit_of_measurement: °C
    mode: box

input_select:
  cleverbox_1_draft_mode:
    name: Radiator 1 draft mode
    options: [Comfort, 'Off', Frost, Eco]
    initial: Comfort
  cleverbox_2_draft_mode:
    name: Radiator 2 draft mode
    options: [Comfort, 'Off', Frost, Eco]
    initial: Comfort

script:
  cleverbox_apply:
    alias: Cleverbox apply draft
    description: Publish the draft target and mode once. No retry.
    mode: parallel
    fields:
      radiator_id:
        required: true
        selector:
          select:
            options: ["1", "2"]
    sequence:
      - variables:
          rid: "{{ radiator_id | string }}"
          mode_name: "{{ states('input_select.cleverbox_' ~ radiator_id ~ '_draft_mode') }}"
          target: "{{ states('input_number.cleverbox_' ~ radiator_id ~ '_draft_target') | float }}"
      - condition: template
        value_template: "{{ is_state('binary_sensor.cleverbox_ready', 'on') and mode_name in ['Comfort', 'Off', 'Frost', 'Eco'] }}"
      - action: mqtt.publish
        data:
          topic: "{{ 'cleverbox/v1/020000000001/radiators/' ~ rid ~ '/set' }}"
          qos: 0
          retain: false
          payload: >-
            {{ dict(mode={'Comfort': 0, 'Off': 1, 'Frost': 2, 'Eco': 3}[mode_name],
                    centi_c=0 if mode_name == 'Off' else (target * 100) | round | int) | to_json }}

template:
  - button:
      - name: Cleverbox 1 apply
        unique_id: cleverbox_020000000001_1_apply
        availability: "{{ is_state('binary_sensor.cleverbox_ready', 'on') }}"
        press:
          - action: script.cleverbox_apply
            data:
              radiator_id: "1"
      - name: Cleverbox 2 apply
        unique_id: cleverbox_020000000001_2_apply
        availability: "{{ is_state('binary_sensor.cleverbox_ready', 'on') }}"
        press:
          - action: script.cleverbox_apply
            data:
              radiator_id: "2"
