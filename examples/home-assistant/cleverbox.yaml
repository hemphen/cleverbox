# Optional draft/Apply package for two radiators; discovery supplies observations.
# Replace EVERY 020000000001 and IDs 1/2. Only Apply transmits.
mqtt:
  sensor:
  - name: Cleverbox session
    unique_id: cleverbox_020000000001_session
    state_topic: cleverbox/v1/020000000001/bridge
    value_template: '{{ value_json.session }}'
    expire_after: 15
    force_update: true
  - name: Cleverbox 1 snapshot
    unique_id: cleverbox_020000000001_1_snapshot
    state_topic: cleverbox/v1/020000000001/radiators/1/state
    value_template: '{{ value_json.session }}'
    json_attributes_topic: cleverbox/v1/020000000001/radiators/1/state
    json_attributes_template: '{{ dict(value_json, report_available=value_json.available) | to_json }}'
    expire_after: 15
    force_update: true
  - name: Cleverbox 2 snapshot
    unique_id: cleverbox_020000000001_2_snapshot
    state_topic: cleverbox/v1/020000000001/radiators/2/state
    value_template: '{{ value_json.session }}'
    json_attributes_topic: cleverbox/v1/020000000001/radiators/2/state
    json_attributes_template: '{{ dict(value_json, report_available=value_json.available) | to_json }}'
    expire_after: 15
    force_update: true
  binary_sensor:
  - name: Cleverbox ready
    unique_id: cleverbox_020000000001_ready
    state_topic: cleverbox/v1/020000000001/availability
    payload_on: online
    payload_off: offline
input_number:
  cleverbox_1_draft_target:
    name: Radiator 1 draft target
    min: 5
    max: 30
    step: 0.5
    initial: 21
    unit_of_measurement: °C
    mode: box
  cleverbox_2_draft_target:
    name: Radiator 2 draft target
    min: 5
    max: 30
    step: 0.5
    initial: 21
    unit_of_measurement: °C
    mode: box
input_select:
  cleverbox_1_draft_mode:
    name: Radiator 1 draft mode
    options:
    - Comfort
    - 'Off'
    - Frost
    - Eco
    initial: Comfort
  cleverbox_2_draft_mode:
    name: Radiator 2 draft mode
    options:
    - Comfort
    - 'Off'
    - Frost
    - Eco
    initial: Comfort
script:
  cleverbox_apply:
    alias: Cleverbox apply complete draft
    description: Explicit one-shot Apply; no retry or offline queue.
    mode: parallel
    max: 8
    fields:
      radiator_id:
        required: true
        selector:
          select:
            options:
            - '1'
            - '2'
    sequence:
    - variables:
        rid: '{{ radiator_id | string }}'
    - condition: template
      value_template: '{{ (rid | string) in [''1'', ''2''] }}'
    - variables:
        snapshot: '{{ ''sensor.cleverbox_'' ~ rid ~ ''_snapshot'' }}'
        mode_name: '{{ states(''input_select.cleverbox_'' ~ rid ~ ''_draft_mode'') }}'
        target: '{{ states(''input_number.cleverbox_'' ~ rid ~ ''_draft_target'') | float }}'
    - condition: template
      value_template: "{{ is_state('binary_sensor.cleverbox_ready', 'on')\n   and has_value('sensor.cleverbox_session')\
        \ and has_value(snapshot)\n   and states(snapshot) == states('sensor.cleverbox_session')\n   and (state_attr(snapshot,\
        \ 'command_token') | default('', true) | length) == 32\n   and mode_name in ['Comfort', 'Off', 'Frost',\
        \ 'Eco'] and 5 <= target <= 30 }}"
    - action: mqtt.publish
      data:
        topic: '{{ ''cleverbox/v1/020000000001/radiators/'' ~ rid ~ ''/set'' }}'
        qos: 0
        retain: false
        payload: "{{ dict(session=states(snapshot), command_token=state_attr(snapshot, 'command_token'),\n     \
          \   mode={'Comfort': 0, 'Off': 1, 'Frost': 2, 'Eco': 3}[mode_name],\n        centi_c=0 if mode_name ==\
          \ 'Off' else (target * 100) | round | int) | to_json }}"
template:
- button:
  - name: Cleverbox 1 apply
    unique_id: cleverbox_020000000001_1_apply
    availability: "{{ is_state('binary_sensor.cleverbox_ready', 'on')\n    and has_value('sensor.cleverbox_session')\n\
      \    and has_value('sensor.cleverbox_1_snapshot')\n    and states('sensor.cleverbox_1_snapshot') == states('sensor.cleverbox_session')\
      \ }}"
    press:
    - action: script.cleverbox_apply
      data:
        radiator_id: '1'
- button:
  - name: Cleverbox 2 apply
    unique_id: cleverbox_020000000001_2_apply
    availability: "{{ is_state('binary_sensor.cleverbox_ready', 'on')\n    and has_value('sensor.cleverbox_session')\n\
      \    and has_value('sensor.cleverbox_2_snapshot')\n    and states('sensor.cleverbox_2_snapshot') == states('sensor.cleverbox_session')\
      \ }}"
    press:
    - action: script.cleverbox_apply
      data:
        radiator_id: '2'
